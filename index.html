<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kıvanç Karademir</title>
    <meta name="description" data-i18n-content="meta.description" content="Hayatın yılları, plak plak: her plak bir dönem, her dönem bir yazı." />
    <meta name="theme-color" content="#0b0a09" />
    <script>
      if (/^#\/[^/]/.test(location.hash)) document.documentElement.classList.add('deeplink');
      try {
        var q = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang');
        if (q === 'en' || q === 'tr') document.documentElement.lang = q;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23110f0e'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23332d29' stroke-width='1'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23332d29' stroke-width='1'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23b3384a'/%3E%3Ccircle cx='32' cy='32' r='2' fill='%23110f0e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />
  </head>
  <body>
    <a class="skip" href="#tl" data-i18n="a11y.skip">Plak listesine atla</a>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="boot" aria-hidden="true"><span class="boot-disc"></span></div>

    <header class="top">
      <a class="brand" href="#/" data-i18n-aria="a11y.home" aria-label="Ana sayfa">
        <span class="brand-disc" aria-hidden="true"></span>
        <span class="brand-name" data-site-name>Kıvanç Karademir</span>
        <span class="brand-sub" data-site-sub></span>
      </a>
      <div class="top-r">
      <div class="lang" role="group" data-i18n-aria="a11y.language" aria-label="Dil seçimi">
        <button type="button" data-lang="tr" lang="tr" aria-pressed="true" title="Türkçe">TR</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false" title="English">EN</button>
      </div>
      <div class="np" data-state="loading">
        <p class="np-meta" aria-live="polite">
          <span class="np-k" data-i18n="music.now">Şimdi çalıyor</span>
          <span class="np-t" data-music-title></span><span class="np-a" data-music-artist></span>
        </p>
        <div class="np-frame"><div class="np-sp"></div></div>
        <div class="np-ytrow">
          <div class="np-video"><div class="np-yt"></div></div>
          <p class="np-ymeta"><span class="np-t" data-music-title></span><span class="np-a" data-music-artist></span></p>
          <button class="np-btn" type="button" aria-pressed="false" aria-label="Müziği çal">
            <span class="snd-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="np-play" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      </div>
    </header>

    <main class="hero" id="hero">
      <h1 class="sr-only" data-i18n="a11y.h1">Kıvanç Karademir: hayatımın yılları, plak plak</h1>

      <div class="hero-idx" aria-hidden="true">
        <span class="idx-c">01</span><span class="idx-l"></span><span class="idx-t">08</span>
      </div>

      <div class="hero-meta">
        <p class="hero-year"><span class="roll"></span></p>
        <h2 class="hero-name"><span class="roll"></span></h2>
        <p class="hero-sub"><span class="roll"></span></p>
        <button class="hero-open" type="button"><span data-i18n="hero.open">Plağa gir</span><kbd>↵</kbd></button>
      </div>

      <div class="hero-hint" aria-hidden="true">
        <span data-i18n="hero.drag">Sürükle</span><span data-i18n="hero.scroll">Kaydır</span><span>← →</span>
      </div>

      <nav class="tl-wrap" data-i18n-aria="a11y.records" aria-label="Plaklar">
        <ol class="tl" id="tl"></ol>
        <span class="tl-needle" aria-hidden="true"></span>
      </nav>

      <div class="minis-cap" data-i18n-aria="a11y.singles" aria-label="Alt plaklar"></div>
      <div class="minis-strip" data-i18n-aria="a11y.singles" aria-label="Alt plaklar"></div>
      <p class="sr-only" aria-live="polite" id="live"></p>
    </main>

    <section class="post" id="post" aria-hidden="true" data-i18n-aria="a11y.article" aria-label="Yazı" inert>
      <div class="post-scroll">
        <div class="post-inner"></div>
      </div>
      <div class="post-bar">
        <button class="post-close" type="button">
          <span class="pc-ico" aria-hidden="true"></span><span data-i18n="post.back">Plağa dön</span><kbd>Esc</kbd>
        </button>
        <button class="ring" type="button" data-i18n-aria="a11y.progress" aria-label="Okuma ilerlemesi, başa dön">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <circle cx="28" cy="28" r="26" class="ring-g" />
            <circle cx="28" cy="28" r="18" class="ring-g" />
            <circle cx="28" cy="28" r="14" class="ring-g" />
            <circle cx="28" cy="28" r="22" class="ring-arc" />
          </svg>
          <span class="ring-t">0</span>
        </button>
      </div>
    </section>

    <div class="cursor" aria-hidden="true"><span class="cursor-r"></span><span class="cursor-t"></span></div>
    <div class="grain" aria-hidden="true"></div>
    <noscript><p class="nojs">Bu deneyim JavaScript gerektirir. This website requires JavaScript.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
